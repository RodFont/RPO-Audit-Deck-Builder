# Reverse proxy in front of the FastAPI app.
# Akamai is the public edge (CDN/WAF) for your domain; this nginx is the
# Linode *origin* that Akamai forwards traffic to. TLS here protects the
# Akamai -> origin hop (recommended: "Origin over HTTPS" in Akamai).

server {
    listen 80;
    server_name _;
    # Let's Encrypt HTTP-01 challenge path (used by certbot renewals)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Reports can be a few MB; keep this in sync with MAX_UPLOAD_BYTES in .env
    client_max_body_size 30m;

    location / {
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /healthz {
        proxy_pass http://app:8000/healthz;
        access_log off;
    }
}
