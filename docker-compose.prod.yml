# Used on the Linode server (no build context needed there — the image is
# built in CI and pulled from GHCR). Local dev should use docker-compose.yml
# instead, which builds from source.
services:
  app:
    image: ${IMAGE:-ghcr.io/OWNER/REPO:latest}
    container_name: rpo-audit-app
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3

  nginx:
    image: nginx:1.27-alpine
    container_name: rpo-audit-nginx
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "443:443"
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./certbot-www:/var/www/certbot:ro
