<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>RPO Report Audit</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 4rem auto; padding: 0 1rem; }
    h1 { font-size: 1.4rem; }
    form { display: flex; flex-direction: column; gap: 0.75rem; }
    input, button { padding: 0.5rem; font-size: 1rem; }
    button { cursor: pointer; }
    #status { margin-top: 1rem; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>RPO Report Audit — Upload Report</h1>
  <form id="f">
    <input type="file" name="file" accept=".xlsx,.xlsm,.csv" required />
    <input type="text" name="title" placeholder="Deck title (optional)" />
    <input type="text" name="client" placeholder="Client name (optional)" />
    <button type="submit">Generate audit deck</button>
  </form>
  <div id="status"></div>
  <script>
    const form = document.getElementById('f');
    const statusEl = document.getElementById('status');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      statusEl.textContent = 'Processing…';
      const fd = new FormData(form);
      const params = new URLSearchParams();
      if (fd.get('title')) params.set('title', fd.get('title'));
      if (fd.get('client')) params.set('client', fd.get('client'));
      const body = new FormData();
      body.append('file', fd.get('file'));
      try {
        const res = await fetch('/api/audit?' + params.toString(), { method: 'POST', body });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(err.detail || res.statusText);
        }
        const blob = await res.blob();
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'audit_summary.zip';
        a.click();
        statusEl.textContent = 'Done. Download started.';
      } catch (err) {
        statusEl.textContent = 'Error: ' + err.message;
      }
    });
  </script>
</body>
</html>
